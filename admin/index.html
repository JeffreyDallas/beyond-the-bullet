<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Beyond the Bullet Admin</title>
<style>body{font:14px system-ui;margin:32px;background:#101311;color:#edf3e9}h1{color:#d5ff4f}table{border-collapse:collapse;width:100%;margin:16px 0 32px;background:#192119}th,td{padding:10px;border:1px solid #354335;text-align:left}th{color:#d5ff4f}small{color:#9aaa99}</style></head>
<body><h1>Beyond the Bullet · Admin</h1><small>Local read-only usage dashboard</small><h2>Session usage</h2><table><thead><tr><th>User</th><th>Started</th><th>Ended</th><th>Duration (s)</th><th>Forward</th><th>Backward</th><th>Input tokens</th><th>Output tokens</th></tr></thead><tbody id="sessions"></tbody></table><h2>LLM calls</h2><table><thead><tr><th>Time</th><th>User</th><th>Model</th><th>Provider</th><th>Input</th><th>Output</th></tr></thead><tbody id="usage"></tbody></table><script>
const render=async()=>{const [s,u]=await Promise.all([fetch('/api/admin/sessions').then(r=>r.json()),fetch('/api/admin/usage').then(r=>r.json())]);document.querySelector('#sessions').innerHTML=s.map(x=>`<tr><td>${x.user}</td><td>${x.started_at||''}</td><td>${x.ended_at||''}</td><td>${x.duration_seconds??''}</td><td>${x.turns_forward}</td><td>${x.turns_backward}</td><td>${x.input_tokens}</td><td>${x.output_tokens}</td></tr>`).join('');document.querySelector('#usage').innerHTML=u.map(x=>`<tr><td>${x.time}</td><td>${x.user}</td><td>${x.model}</td><td>${x.provider}</td><td>${x.input}</td><td>${x.output}</td></tr>`).join('')};render();setInterval(render,10000);
</script></body></html>
